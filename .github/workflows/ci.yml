# Default: single-app repo, everything runs from the repo root.
#
# Adapting this for a monorepo (multiple apps in one repo, e.g. app/ + www/):
#   1. Add `paths: ['<app-folder>/**']` under both `on.pull_request` and `on.push`
#      so this workflow only runs when that app's files actually change.
#   2. Add `defaults.run.working-directory: <app-folder>` at the job level so
#      every `run:` step below executes inside the app folder instead of repo root.
#   3. Copy this file once per app (e.g. ci-tools.yml, ci-www.yml) rather than
#      trying to build every app in one workflow — each app gets its own
#      independent pass/fail gate, matching independent deploys (e.g. Vercel's
#      per-app root-directory setting).
#
# Supabase in CI: this workflow spins up an EPHEMERAL local Supabase stack inside the
# job (Docker, via `supabase start` against the committed `supabase/config.toml`) — the
# same thing local dev runs. Its API URL / anon key / service-role key are fixed local
# demo values, captured at runtime with `supabase status -o env`, so **no GitHub Actions
# secrets are required** for build + test to go green, and there is no hosted "CI project"
# to create or maintain. A real hosted Supabase project is only needed for the actual
# Vercel production deploy, not for CI. See ai-context/DECISIONS.md.
name: CI

on:
  pull_request:
    branches: [main]
    # paths: ['<app-folder>/**']   # uncomment + fill in for monorepo use
  push:
    branches: [main]
    # paths: ['<app-folder>/**']   # uncomment + fill in for monorepo use

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # defaults:
    #   run:
    #     working-directory: <app-folder>   # uncomment + fill in for monorepo use
    env:
      # Phase 6 (food lookup) reads USDA_FDC_API_KEY server-side. CI mocks the provider, so a real
      # key is never needed for tests to pass; the dummy just keeps the var defined. Set the real key
      # as a repo secret ONLY if you deliberately want CI to hit the live USDA API (not recommended).
      USDA_FDC_API_KEY: ${{ secrets.USDA_FDC_API_KEY || 'ci-dummy-usda-key' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # --- Ephemeral local Supabase (Docker) for build + e2e. No hosted project, no GitHub secrets. ---
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (applies ./supabase migrations + seed)
        run: supabase start

      - name: Export local Supabase env for build + e2e
        # `supabase status -o env` prints the running stack's fixed local values; --override-name
        # maps them to the names the app (NEXT_PUBLIC_*) and the e2e admin client
        # (SUPABASE_SERVICE_ROLE_KEY) read. Appending to $GITHUB_ENV exposes them to later steps
        # (including the Next server Playwright launches). These are non-secret local demo keys.
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Integration/acceptance tests
        run: npm run test:e2e

      - name: Stop Supabase
        if: always()
        run: supabase stop

  gate:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Require all tests passed
        run: echo "Merge only reaches here if build-and-test succeeded"
